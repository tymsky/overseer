[project]
name = "overseer"
version = "0.1.0"
description = "A bot that plays Fallout (1997) on Windows, with your own copy of the game."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pillow>=11", "windows-capture>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f1"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
